services:
  sorteio-vagas:
    build:
      context: .
      dockerfile: Dockerfile
    image: sorteio-vagas-sqlite:latest
    container_name: sorteio-vagas-sqlite
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=America/Sao_Paulo
    volumes:
      - sorteio_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || curl -f http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  sorteio_data:
    driver: local
